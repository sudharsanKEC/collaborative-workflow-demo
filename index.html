<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function LoginForm() {
            return (
                <div className="auth-container">
                    <h2>Login</h2>
                    <form className="auth-form" onSubmit={(e) => e.preventDefault()}>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Enter email" required />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" placeholder="Enter password" required />
                        </div>
                        <button type="submit" className="submit-btn login-submit">Login</button>
                    </form>
                </div>
            );
        }

        function SignupForm() {
            return (
                <div className="auth-container">
                    <h2>Sign Up</h2>
                    <form className="auth-form" onSubmit={(e) => e.preventDefault()}>
                        <div className="form-group">
                            <label>Name</label>
                            <input type="text" placeholder="Enter name" required />
                        </div>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Enter email" required />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" placeholder="Enter password" required />
                        </div>
                        <button type="submit" className="submit-btn signup-submit">Sign Up</button>
                    </form>
                </div>
            );
        }

        function App() {
            const [view, setView] = useState('home');

            return (
                <div className="app-container">
                    <nav className="navbar">
                        <div className="navbar-brand" onClick={() => setView('home')} style={{ cursor: 'pointer' }}>
                            Welcome to TaskManager
                        </div>
                        <div className="navbar-links">
                            <button onClick={() => setView('signup')} className={`nav-btn signup-btn ${view === 'signup' ? 'active' : ''}`}>Signup</button>
                            <button onClick={() => setView('login')} className={`nav-btn login-btn ${view === 'login' ? 'active' : ''}`}>Login</button>
                        </div>
                    </nav>
                    <main className="main-content">
                        {view === 'home' && (
                            <div className="hero">
                                <h1>Manage Your Tasks Efficiently</h1>
                                <p>Select Login or Signup to get started.</p>
                            </div>
                        )}
                        {view === 'login' && <LoginForm />}
                        {view === 'signup' && <SignupForm />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
